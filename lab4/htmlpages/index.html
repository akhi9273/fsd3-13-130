<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Registration - Bright Future</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f7fb;color:#222}
nav{background:#173b7a;padding:15px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{color:#fff;font-size:25px;font-weight:bold}
nav ul{display:flex;list-style:none;gap:25px}
nav ul a{color:#fff;text-decoration:none}
nav ul a:hover{color:#ffd43b}
.container{width:90%;max-width:600px;margin:50px auto}
.heading{text-align:center;margin-bottom:25px}.heading h1{color:#173b7a;margin-bottom:10px}
.form-box,.login-box,.feedback-box{background:#fff;padding:30px;border-radius:12px;box-shadow:0 5px 20px #0000001a}
.form-group{margin-bottom:18px}label{display:block;margin-bottom:7px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;outline:none}
textarea{resize:vertical;min-height:120px}
.btn,button,.choose{background:#173b7a;color:#fff;border:0;border-radius:6px;padding:13px;cursor:pointer;text-decoration:none}
.btn,button{width:100%;font-size:16px}.btn:hover,button:hover,.choose:hover{background:#0f2b5c}
footer{margin-top:60px;background:#102a56;color:#fff;text-align:center;padding:25px}
.social-icons{margin:15px}.social-icons a{color:#fff;font-size:22px;margin:0 10px;text-decoration:none}
.social-icons a:hover{color:#ffd43b}
@media(max-width:700px){nav{flex-direction:column;gap:15px}nav ul{flex-wrap:wrap;justify-content:center;gap:15px}}
</style>
</head><body>

<div class="container"><div class="heading"><h1>Student Registration</h1><p>Register now and start your learning journey.</p></div>
<div class="form-box"><form>
<div class="form-group"><label>Full Name</label><input type="text" placeholder="Enter your full name" required></div>
<div class="form-group"><label>Email</label><input type="email" placeholder="Enter your email" required></div>
<div class="form-group"><label>Phone Number</label><input type="tel" placeholder="Enter your phone number" required></div>
<div class="form-group"><label>Select Class</label><select required><option value="">Select Class</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></select></div>
<div class="form-group"><label>Select Course</label><select required><option value="">Select Course</option><option>Mathematics</option><option>Science</option><option>English</option><option>Computer Science</option><option>Complete Package</option></select></div>
<div class="form-group"><label>Password</label><input type="password" placeholder="Create password" required></div>
<button class="btn" type="submit"><i class="fa-solid fa-user-plus"></i> Register Now</button>
</form></div></div>
<footer>
<h3>Bright Future Tuition Classes</h3>
<p>Learn Today • Succeed Tomorrow</p>
