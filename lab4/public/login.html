<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login - Bright Future</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f7fb;color:#222}
nav{background:#173b7a;padding:15px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{color:#fff;font-size:25px;font-weight:bold}
nav ul{display:flex;list-style:none;gap:25px}
nav ul a{color:#fff;text-decoration:none}
nav ul a:hover{color:#ffd43b}
.container{width:90%;max-width:600px;margin:50px auto}
.heading{text-align:center;margin-bottom:25px}.heading h1{color:#173b7a;margin-bottom:10px}
.form-box,.login-box,.feedback-box{background:#fff;padding:30px;border-radius:12px;box-shadow:0 5px 20px #0000001a}
.form-group{margin-bottom:18px}label{display:block;margin-bottom:7px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;outline:none}
textarea{resize:vertical;min-height:120px}
.btn,button,.choose{background:#173b7a;color:#fff;border:0;border-radius:6px;padding:13px;cursor:pointer;text-decoration:none}
.btn,button{width:100%;font-size:16px}.btn:hover,button:hover,.choose:hover{background:#0f2b5c}
footer{margin-top:60px;background:#102a56;color:#fff;text-align:center;padding:25px}
.social-icons{margin:15px}.social-icons a{color:#fff;font-size:22px;margin:0 10px;text-decoration:none}
.social-icons a:hover{color:#ffd43b}
@media(max-width:700px){nav{flex-direction:column;gap:15px}nav ul{flex-wrap:wrap;justify-content:center;gap:15px}}
</style>

<style>.login-container{min-height:600px;display:flex;justify-content:center;align-items:center}.login-box{width:400px}.login-box h1{text-align:center;color:#173b7a;margin-bottom:20px}.login-icon{text-align:center;font-size:50px;color:#173b7a;margin-bottom:15px}.forgot{display:block;text-align:right;margin-bottom:15px;color:#173b7a;text-decoration:none}</style>
</head><body>
<nav>
<div class="logo"><i class="fa-solid fa-graduation-cap"></i> Bright Future</div>

</ul>
</nav>
<div class="login-container"><div class="login-box"><div class="login-icon"><i class="fa-solid fa-circle-user"></i></div><h1>Student Login</h1>
<div class="form-group"><label>Email</label><input type="email" placeholder="Enter your email" required></div>
<div class="form-group"><label>Password</label><input type="password" placeholder="Enter your password" required></div>
<a href="#" class="forgot">Forgot Password?</a><button><i class="fa-solid fa-right-to-bracket"></i> Login</button>
</div></div>
<footer>
<h3>Bright Future Tuition Classes</h3>
<p>Learn Today • Succeed Tomorrow</p>

</div>
<p>© 2026 Bright Future Tuition Classes. All Rights Reserved.</p>
</footer>
</body></html>
